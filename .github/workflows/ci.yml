name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The test suite uses tomllib, which is stdlib from Python 3.11.
        python-version: ['3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,mcp,vscode]"

    - name: Run tests
      run: |
        pytest tests/ --cov=analyzer --cov=interfaces --cov=mcp --cov-report=xml --cov-report=term

  security:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install bandit

    - name: Run Tracked Secret Scan
      run: |
        python scripts/scan_secrets.py

    - name: Run Bandit Security Scan (fail on high severity)
      run: |
        bandit -r analyzer interfaces mcp -lll

  integration:
    runs-on: ubuntu-latest
    needs: [test]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install package
      run: |
        pip install -e ".[dev,mcp,vscode,enterprise]"

    - name: Run Integration Tests
      run: |
        pytest tests/e2e/ -v -m "integration" --no-cov

    - name: Test CLI
      run: |
        connascence --help
        # scan exits 1 when violations are found; only >=2 means the tool broke
        connascence scan examples/ --format json || [ $? -eq 1 ]
