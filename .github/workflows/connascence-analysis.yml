name: Connascence Safety Analysis
on:
  push:
    branches: [main, develop, feature/*]
  pull_request:
    branches: [main, develop]

# Permissions required for SARIF upload
permissions:
  contents: read
  security-events: write

jobs:
  connascence-analysis:
    runs-on: ubuntu-latest
    name: "Connascence Analysis Pipeline"
    timeout-minutes: 20

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # Install the package itself so the connascence CLI is on PATH
        pip install -e .

    - name: Unicode Code Safety Check
      run: |
        echo "::group::Unicode Safety Validation"
        python scripts/remove_unicode.py --check . --report-json unicode_violations.json
        echo "::endgroup::"

    - name: Full Connascence Scan
      run: |
        echo "::group::Full Connascence Analysis"
        # scan exits 1 when violations are found (reporting only here, the
        # quality gate is self-analysis.yml); only >=2 means the tool broke
        connascence scan . --format json --output connascence_full.json || [ $? -eq 1 ]
        python -c "import json; d=json.load(open('connascence_full.json')); v=d.get('violations', []); print('Total violations:', len(v)); print('Critical:', len([x for x in v if x.get('severity') == 'critical'])); print('Quality score:', d.get('quality_score'))"
        echo "::endgroup::"

    - name: NASA Policy Scan
      run: |
        echo "::group::NASA Compliance Policy Analysis"
        connascence scan . --policy nasa-compliance --format json --output nasa_analysis.json || [ $? -eq 1 ]
        python -c "import json; d=json.load(open('nasa_analysis.json')); print('NASA-policy violations:', len(d.get('violations', [])))"
        echo "::endgroup::"

    - name: MECE Duplication Analysis
      run: |
        echo "::group::MECE Duplication Detection"
        python -m analyzer.dup_detection.mece_analyzer --path . --comprehensive --output mece_analysis.json
        python -c "import json; d=json.load(open('mece_analysis.json')); print('MECE score:', d.get('mece_score')); print('Duplications:', len(d.get('duplications', [])))"
        echo "::endgroup::"

    - name: Generate SARIF Report
      run: |
        echo "::group::SARIF Generation"
        connascence scan . --format sarif --output connascence_analysis.sarif || [ $? -eq 1 ]
        python -m json.tool connascence_analysis.sarif > /dev/null
        echo "SARIF file size: $(wc -c < connascence_analysis.sarif) bytes"
        echo "::endgroup::"

    - name: Upload SARIF Results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      # Code scanning may not be enabled on forks or all repos.
      continue-on-error: true
      with:
        sarif_file: connascence_analysis.sarif
        category: connascence-analysis

    - name: Upload Analysis Artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: connascence-analysis-results
        path: |
          unicode_violations.json
          connascence_full.json
          nasa_analysis.json
          mece_analysis.json
          connascence_analysis.sarif
